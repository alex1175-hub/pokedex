name: pokedex_app
description: Práctica Flutter - consumo de la PokeAPI con Dio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Paso 1: paquete Dio para peticiones de red
  dio: ^5.4.0
  # Sonidos de la Pokédex y gritos de los Pokémon
  audioplayers: ^6.1.0
  # Login local (sesión y equipos guardados en el dispositivo)
  shared_preferences: ^2.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
